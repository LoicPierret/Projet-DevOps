apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2023
  amiSelectorTerms:
    - alias: al2023@latest
  # Nom (pas ARN) : Karpenter crée et gère lui-même le profil d'instance
  # associé à ce rôle (iam:CreateInstanceProfile... dans sa policy IAM),
  # aucun aws_iam_instance_profile à créer côté Terraform.
  role: {{ .Values.nodeRoleName | quote }}
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.clusterName | quote }}
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.clusterName | quote }}
  tags:
    karpenter.sh/discovery: {{ .Values.clusterName | quote }}
