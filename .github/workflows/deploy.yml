name: CD - Deploy to EKS

# Se déclenche automatiquement quand "CI - Build, Scan, Test Docker &
# Validate Terraform" termine avec succès sur main (voir ci.yml). Le
# déploiement réel (update-gitops, deploy) reste néanmoins bloqué derrière
# l'approbation manuelle de l'environment GitHub "production" (Settings >
# Environments > production > Required reviewers, à configurer une fois
# dans l'UI GitHub - non gérable depuis ce fichier) : la CI verte ne
# suffit donc jamais à déployer seule, il faut toujours une confirmation
# humaine explicite.
on:
  workflow_run:
    workflows: ["CI - Build, Scan, Test Docker & Validate Terraform"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: ./terraform/app
  IMAGE_NAME: ic-webapp
  DOCKERHUB_ID: azeriock
  GITOPS_REPO: LoicPierret/GitOps_Kubernetes
  # Commit exact à déployer : celui que "workflow_run" vient de valider, ou
  # à défaut (déclenchement manuel via workflow_dispatch) la tête de main.
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # "workflow_run" se déclenche aussi quand la CI échoue (types: [completed]
  # couvre tous les statuts) : cette étape bloque toute la suite si ce n'est
  # pas un succès, sans quoi un échec de CI laisserait quand même passer un
  # déploiement.
  check-ci:
    name: "Vérifie que la CI a réussi"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - run: echo "CI validée sur main, on continue."

  docker-push:
    name: "Push Docker Image"
    needs: check-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_ID }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          # Tag immuable (SHA du commit) en plus de "latest" : GitOps a besoin
          # d'une référence stable qui ne change jamais de contenu, ce que
          # "latest" ne garantit pas.
          tags: |
            ${{ env.DOCKERHUB_ID }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.DOCKERHUB_ID }}/${{ env.IMAGE_NAME }}:${{ env.DEPLOY_SHA }}

  update-gitops:
    name: "Update GitOps repo (image tag)"
    needs: docker-push
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout du dépôt GitOps
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_PUSH_TOKEN }}

      - name: Met à jour le tag d'image ic-webapp
        run: |
          sed -i -E "s|(image: ${{ env.DOCKERHUB_ID }}/${{ env.IMAGE_NAME }}):[^ ]+|\1:${{ env.DEPLOY_SHA }}|" apps/ic-webapp/deployment.yaml

      - name: Commit & push si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Aucun changement (image déjà à ce tag), rien à pousser."
          else
            git add apps/ic-webapp/deployment.yaml
            git commit -m "ic-webapp: déploiement de l'image ${{ env.DEPLOY_SHA }}"
            git push
          fi

  plan:
    name: "Terraform Plan (Production)"
    needs: check-ci
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - run: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}

      - run: terraform plan -no-color -out=tfplan
        env:
          TF_VAR_cicd_iam_role_arn: ${{ secrets.AWS_IAM_ROLE_ARN }}
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 1

  deploy:
    name: "Terraform Apply (Infrastructure)"
    needs: plan
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - run: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}

      - run: terraform apply -auto-approve tfplan
        working-directory: ${{ env.TF_WORKING_DIR }}
