name: CD - Deploy to EKS

on:
#  push:
#    branches:
#      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: ./terraform/app
  IMAGE_NAME: ic-webapp
  DOCKERHUB_ID: azeriock
  GITOPS_REPO: LoicPierret/GitOps_Kubernetes

jobs:
  docker-push:
    name: "Push Docker Image"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_ID }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          # Tag immuable (SHA du commit) en plus de "latest" : GitOps a besoin
          # d'une référence stable qui ne change jamais de contenu, ce que
          # "latest" ne garantit pas.
          tags: |
            ${{ env.DOCKERHUB_ID }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.DOCKERHUB_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  update-gitops:
    name: "Update GitOps repo (image tag)"
    needs: docker-push
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout du dépôt GitOps
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_PUSH_TOKEN }}

      - name: Met à jour le tag d'image ic-webapp
        run: |
          sed -i -E "s|(image: ${{ env.DOCKERHUB_ID }}/${{ env.IMAGE_NAME }}):[^ ]+|\1:${{ github.sha }}|" apps/ic-webapp/deployment.yaml

      - name: Commit & push si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Aucun changement (image déjà à ce tag), rien à pousser."
          else
            git add apps/ic-webapp/deployment.yaml
            git commit -m "ic-webapp: déploiement de l'image ${{ github.sha }}"
            git push
          fi

  plan:
    name: "Terraform Plan (Production)"
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - run: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}

      - run: terraform plan -no-color -out=tfplan
        env:
          TF_VAR_cicd_iam_role_arn: ${{ secrets.AWS_IAM_ROLE_ARN }}
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 1

  deploy:
    name: "Terraform Apply (Infrastructure)"
    needs: plan
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - run: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}

      - run: terraform apply -auto-approve tfplan
        working-directory: ${{ env.TF_WORKING_DIR }}
